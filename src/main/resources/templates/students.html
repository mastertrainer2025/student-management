<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <h1>Student Management System</h1>

    <a class="btn" th:href="@{/students/new}">+ Add Student</a>

    <div th:if="${#lists.isEmpty(students)}" class="empty">
        No students found. Click "Add Student" to create one.
    </div>

    <table th:unless="${#lists.isEmpty(students)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.id}"></td>
            <td th:text="${student.name}"></td>
            <td th:text="${student.email}"></td>
            <td th:text="${student.course}"></td>
            <td>
                <a class="edit" th:href="@{/students/edit/{id}(id=${student.id})}">Edit</a>
                <a class="delete"
                   th:href="@{/students/delete/{id}(id=${student.id})}"
                   onclick="return confirm('Are you sure you want to delete this student?');">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
